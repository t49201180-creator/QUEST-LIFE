
name: Build QUEST LIFE 3.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project ZIP
        run: |
          test -f QUEST_LIFE_3_0_Android_Project.zip || {
            echo "ERROR: Project ZIP not found!"
            exit 1
          }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q QUEST_LIFE_3_0_Android_Project.zip -d extracted

      - name: Find Android project
        id: project
        run: |
          SETTINGS_FILE=$(find extracted -type f -name settings.gradle -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find extracted -type f -name settings.gradle.kts -print -quit)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android Gradle project not found in ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle --no-daemon assembleDebug

      - name: Find generated APK
        id: apk
        run: |
          APK=$(find "${{ steps.project.outputs.dir }}" \
            -type f -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload QUEST LIFE 3.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: QUEST-LIFE-3.0-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          
